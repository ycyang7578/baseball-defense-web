name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest.ini 預設 -m "not integration"，跳過需要本機 PostgreSQL/
      # PyMC 採樣的測試（見 tests/test_api_main.py 等），只跑純單元測試。
      - name: Run test suite
        run: python -m pytest -v
