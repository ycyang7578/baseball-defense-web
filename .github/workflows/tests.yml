name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest.ini defaults to -m "not integration", skipping tests that need a local PostgreSQL/
      # PyMC sampling setup (see tests/test_api_main.py etc.) and running pure unit tests only.
      - name: Run test suite
        run: python -m pytest -v
